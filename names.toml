name = "model_draw_bone"
note = "Builds one bone's matrix (billboarded when flag 1 is set), draws its display list, then recurses into child bones. Patched in Quest64-Recomp/patches/main.c."

# ---- Time ----

[[function]]
vram = 0x800102D0
name = "time_tick"
note = "Advances gCurrentTime by 1; on reaching gDayLength wraps and increments gCurrentDay (capped at 999). Disassembly; see research/time."

[[function]]
vram = 0x80010510
name = "time_set"
note = "Sets gCurrentTime; on overflow increments gCurrentDay (capped at 9999). Likely used by inns. Disassembly."
