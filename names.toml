# ---- Frame, menus and popups ----

[[function]]
vram = 0x800011DC
name = "frame_build"
note = "Builds one frame for the current game mode: pause menu (gGameState bit 0), dialogue (bit 1) or hud_draw_main; the system menu changes gGameMode inside it."

[[function]]
vram = 0x80018DF4
name = "damage_popup_spawn"
note = "(battleData, kind, amount): shows a damage number over a fighter for 45 frames (9 popup slots at 0x800873D0, 0x1C each)."

[[function]]
vram = 0x80026A40
name = "sysmenu_reset_flags"
note = "Resets the system menu's flags and state when it closes (gMenuFlags = 0x8000, gSaveMenuState = 0)."

[[function]]
vram = 0x80026A04
name = "bgm_apply_volume"
note = "Applies the music volume setting (gBgmVolume) through a table; called when the system menu hands over to the field (likely)."

[[function]]
vram = 0x8002413C
name = "world_to_screen"
note = "(f32 x, f32 y, f32 z, s32* sx, s32* sy): projects a scene point to screen pixels; returns 0 when off screen. Used to place damage numbers."

[[function]]
vram = 0x80018F60
name = "damage_popup_draw"
note = "Draws the active damage numbers (slots at 0x800873D0) over their fighters, using world_to_screen."

