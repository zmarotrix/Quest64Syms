# Names for Quest 64 (USA 1.0) functions and data, keyed by address.
#
# This file is the source of truth for symbol names. tools/apply_names.py writes these names into
# dump.toml / data_dump.toml and updates code that uses the old names. Addresses never change, so
# the file can be re-applied at any time (for example after dump.toml is regenerated).
#
# Naming rules:
#   - snake_case with a subsystem prefix: spell_, projectile_, boss_, ai_, brian_, model_, boot_, ...
#   - Only name something once there's evidence for what it does; otherwise leave it as func_XXXXXXXX.
#     Put the evidence in `note` (what it does and how we know).
#   - Renaming only affects source code. Mods that are already built keep working, because packaged
#     mods refer to functions by address.

